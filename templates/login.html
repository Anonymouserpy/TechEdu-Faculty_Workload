<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Faculty Workload System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #172033;
        }
        
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #172033;
        }
        
        .login-header p {
            color: #667085;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: #344054;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f9fafb;
        }
        
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: #ffffff;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px 0 20px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            margin: 0;
            font-weight: normal;
            font-size: 14px;
            color: #667085;
            cursor: pointer;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button[type="submit"]:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        button[type="submit"]:active {
            transform: translateY(0);
        }
        
        .messages {
            margin-bottom: 20px;
        }
        
        .message {
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .message.success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        
        .message.error {
            background: #fef2f2;
            color: #b42318;
            border: 1px solid #fecaca;
        }
        
        .message.warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .links a {
            color: #2563eb;
            text-decoration: none;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #667085;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to the Faculty Workload System</p>
        </div>

        <!-- Display Messages -->
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Login Form -->
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="employee_id">Employee ID</label>
                <input type="text" 
                       name="employee_id" 
                       id="employee_id" 
                       placeholder="Enter your Employee ID" 
                       value="{{ employee_id|default:'' }}"
                       autofocus
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" 
                       name="password" 
                       id="password" 
                       placeholder="Enter your password" 
                       required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" name="remember_me" id="remember_me" {% if request.POST.remember_me %}checked{% endif %}>
                <label for="remember_me">Remember me</label>
            </div>

            <button type="submit" id="loginBtn">
                <span id="loginText">Sign In</span>
                <span id="loginSpinner" style="display: none;"> ⏳</span>
            </button>
        </form>

        <div class="links">
            <a href="{% url 'register' %}">Register</a>
        </div>

        <div class="footer">
            Faculty Workload System &copy; 2024
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-dismiss messages after 5 seconds
            const messages = document.querySelectorAll('.message');
            messages.forEach(function(msg) {
                setTimeout(function() {
                    msg.style.opacity = '0';
                    msg.style.transition = 'opacity 0.5s';
                    setTimeout(function() {
                        msg.style.display = 'none';
                    }, 500);
                }, 5000);
            });

            // Form submission loading state
            const loginForm = document.querySelector('form');
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loginSpinner = document.getElementById('loginSpinner');
            
            loginForm.addEventListener('submit', function(e) {
                const employeeId = document.getElementById('employee_id');
                const password = document.getElementById('password');
                
                if (!employeeId.value.trim() || !password.value.trim()) {
                    e.preventDefault();
                    if (!employeeId.value.trim()) {
                        employeeId.style.borderColor = '#b42318';
                        employeeId.focus();
                    }
                    if (!password.value.trim()) {
                        password.style.borderColor = '#b42318';
                    }
                    return;
                }
                
                loginBtn.disabled = true;
                loginText.textContent = 'Signing in...';
                loginSpinner.style.display = 'inline';
            });

            // Remove error border on input
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', function() {
                    this.style.borderColor = '#d0d5dd';
                });
            });
        });
    </script>
</body>
</html>
